# Atlassian Forge app (OPP-120): an issue panel that starts a planning poker game for the issue.
# It reads the issue as the current user and only opens links to app.openplanningpoker.com, so it needs no
# external fetch and stores nothing. Deploying and listing it: docs/integrations/marketplace.md.
modules:
  jira:issuePanel:
    - key: opp-estimate-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Estimate with Open Planning Poker
      icon: https://app.openplanningpoker.com/open-planning-poker-game-logo-64x64.png
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/REPLACE-WITH-forge-register
permissions:
  scopes:
    - read:jira-work
