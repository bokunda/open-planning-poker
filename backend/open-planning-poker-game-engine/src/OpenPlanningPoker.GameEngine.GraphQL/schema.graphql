schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

interface Error {
  message: String!
}

type AccuracyOutlierInfo {
  ticket: TeamTicket!
  days: Float!
  cardMedianDays: Float!
}

type AddRetroActionItemPayload {
  retroActionItemInfo: RetroActionItemInfo
  errors: [AddRetroActionItemError!]
}

type AddRetroCardPayload {
  retroCardInfo: RetroCardInfo
  errors: [AddRetroCardError!]
}

"Whether the AI assistant can be used in a room (OPP-139)."
type AiAssistantStatus {
  "The server has an API key."
  available: Boolean!
  "The host turned it on for this room."
  enabled: Boolean!
}

type ApiCollectionOfGamePlayer {
  items: [GamePlayer!]!
  totalCount: Int!
}

type ApiCollectionOfTicket {
  items: [Ticket!]!
  totalCount: Int!
}

type ApiCollectionOfVote {
  items: [Vote!]!
  totalCount: Int!
}

type ApplicationError implements Error {
  code: String!
  message: String!
}

type ApplySortedEstimatesPayload {
  sortedEstimatesApplied: SortedEstimatesApplied
  errors: [ApplySortedEstimatesError!]
}

type BaseUserProfile {
  id: UUID!
  userName: String!
}

type CardAccuracyInfo {
  value: String!
  count: Int!
  medianDays: Float!
  minDays: Float!
  maxDays: Float!
}

type ChatMessage {
  id: UUID!
  gameId: UUID!
  playerName: String!
  content: String!
  timestamp: String!
}

type CheckTicketClarityPayload {
  ticketClarity: TicketClarity
  errors: [CheckTicketClarityError!]
}

type ClaimGameHostPayload {
  boolean: Boolean
  errors: [ClaimGameHostError!]
}

type ClearSortContestedPayload {
  sortedTicket: SortedTicket
  errors: [ClearSortContestedError!]
}

type CompleteJiraConnectionPayload {
  jiraConnectionResult: JiraConnectionResult
  errors: [CompleteJiraConnectionError!]
}

type CompleteTrackerConnectionPayload {
  trackerConnected: TrackerConnected
  errors: [CompleteTrackerConnectionError!]
}

type CreateGamePayload {
  game: Game
  errors: [CreateGameError!]
}

type CreateOrUpdateVotePayload {
  vote: Vote
  errors: [CreateOrUpdateVoteError!]
}

type CreateSettingsPayload {
  settings: Settings
  errors: [CreateSettingsError!]
}

type CreateTeamApiTokenPayload {
  createdTeamApiToken: CreatedTeamApiToken
  errors: [CreateTeamApiTokenError!]
}

type CreateTeamPayload {
  team: Team
  errors: [CreateTeamError!]
}

type CreateTeamWebhookPayload {
  createdTeamWebhook: CreatedTeamWebhook
  errors: [CreateTeamWebhookError!]
}

type CreateTicketForIssuePayload {
  ticket: Ticket
  errors: [CreateTicketForIssueError!]
}

type CreateTicketPayload {
  ticket: Ticket
  errors: [CreateTicketError!]
}

type CreatedTeamApiToken {
  info: TeamApiTokenInfo!
  "Shown once: copy it now."
  token: String!
}

type CreatedTeamWebhook {
  info: TeamWebhookInfo!
  "The signing secret, shown once: store it with the receiver."
  secret: String!
}

type DeleteGamePayload {
  boolean: Boolean
  errors: [DeleteGameError!]
}

type DeleteRetroActionItemPayload {
  boolean: Boolean
  errors: [DeleteRetroActionItemError!]
}

type DeleteRetroCardPayload {
  boolean: Boolean
  errors: [DeleteRetroCardError!]
}

type DeleteTeamWebhookPayload {
  boolean: Boolean
  errors: [DeleteTeamWebhookError!]
}

type DeleteTicketPayload {
  boolean: Boolean
  errors: [DeleteTicketError!]
}

type DisconnectJiraPayload {
  boolean: Boolean
  errors: [DisconnectJiraError!]
}

type DisconnectTrackerPayload {
  boolean: Boolean
  errors: [DisconnectTrackerError!]
}

type DismissTicketClarityPayload {
  boolean: Boolean
  errors: [DismissTicketClarityError!]
}

type EditRetroCardPayload {
  boolean: Boolean
  errors: [EditRetroCardError!]
}

"Room options for running the discussion (OPP-114)."
type FacilitationSettings {
  "After a wide spread, the lowest and highest voters are asked to explain their card."
  outlierNotes: Boolean!
  "Minutes of discussion after the reveal (0 = off, 2, 3 or 5)."
  discussionMinutes: Int!
  "Players rate their confidence (1–5) in the final estimate."
  confidenceCheck: Boolean!
  "Players can send emoji reactions."
  reactions: Boolean!
  "A short confetti moment when everyone voted the same card (OPP-172)."
  celebrations: Boolean!
  "Look of the table and the card backs: classic, forest, ocean, sunset, midnight or paper (OPP-173)."
  theme: String!
  "Card backs follow the season."
  seasonalCards: Boolean!
}

type Game {
  settingsDetails: SettingsDetailsResult! @cost(weight: "10")
  id: UUID!
  name: String!
  description: String!
  """
  Id of the player who runs the game: the creator until the host hands it over.
  The host and co-hosts manage tickets, settings and reveals.
  """
  hostId: UUID!
  "Team room the game belongs to (a sprint of that team), if any."
  teamId: UUID
}

"""
A small "something changed" event. It carries no data that is not already public in the game,
so it is safe to broadcast; clients fetch the details with their own (checked) queries.
"""
type GameChanged {
  gameId: UUID!
  kind: GameChangeKind!
  ticketId: UUID
  playerId: UUID
}

type GamePlayer {
  name: String @cost(weight: "10")
  id: UUID!
  "Observers watch the table and do not vote."
  role: PlayerRole!
  "Co-hosts can run the game next to the host."
  isCoHost: Boolean!
  "Emoji avatar the player picked in this room; null shows their initials."
  avatar: String
}

"Public, read-only recap of a session: numbers and ticket titles only."
type GameRecap {
  gameName: String!
  playedOn: DateTime!
  tickets: [RecapTicket!]!
  ticketsEstimated: Int!
  ticketsOpen: Int!
  totalPoints: Float!
  "Share (0–1) of tickets with at least two votes where everyone agreed; null when none."
  consensusRate: Float
  durationMinutes: Float
  playerCount: Int!
  "Who took part; empty unless the host chose to show names."
  players: [String!]!
}

type GameReport {
  gameId: UUID!
  fileName: String!
  data: [Byte!]!
}

"""
Voting timer of a game, shared by all players. The host starts and stops it.
Clients count down to EndsAt and use ServerTime to correct their clock.
"""
type GameTimer {
  gameId: UUID!
  durationSeconds: Int!
  running: Boolean!
  endsAt: DateTime
  serverTime: DateTime!
}

type GenerateGameReportPayload {
  gameReport: GameReport
  errors: [GenerateGameReportError!]
}

type GroupRetroCardPayload {
  boolean: Boolean
  errors: [GroupRetroCardError!]
}

type ImportJiraIssuesPayload {
  jiraImportSummary: JiraImportSummary
  errors: [ImportJiraIssuesError!]
}

type ImportTrackerIssuesPayload {
  trackerImportSummary: TrackerImportSummary
  errors: [ImportTrackerIssuesError!]
}

type Info {
  version: String!
  author: String!
  contact: String!
}

type JiraAuthorizeLink {
  url: String!
}

type JiraBoardInfo {
  id: Long!
  name: String!
  type: String!
}

type JiraBoardList {
  items: [JiraBoardInfo!]!
}

type JiraConnectionResult {
  sites: [JiraSiteInfo!]!
  returnPath: String!
  siteSelected: Boolean!
}

"The caller's Jira connection. Enabled is false when the server has no Atlassian app configured."
type JiraConnectionStatus {
  enabled: Boolean!
  connected: Boolean!
  needsReconnect: Boolean!
  siteName: String
  siteUrl: String
}

type JiraEstimateSaved {
  issueKey: String!
  value: String!
  url: String!
}

type JiraImportSummary {
  imported: Int!
  skipped: Int!
}

type JiraIssuePreview {
  key: String!
  summary: String!
  description: String!
  storyPoints: Float
  url: String!
  alreadyInGame: Boolean!
}

type JiraIssueSearch {
  issues: [JiraIssuePreview!]!
  truncated: Boolean!
  max: Int!
}

type JiraSiteInfo {
  cloudId: String!
  name: String!
  url: String!
}

type JiraSiteList {
  items: [JiraSiteInfo!]!
}

type JiraSprintInfo {
  id: Long!
  name: String!
  state: String!
}

type JiraSprintList {
  items: [JiraSprintInfo!]!
}

"Result of moving the planned tickets into a Jira sprint (OPP-149)."
type JiraSprintMoved {
  moved: Int!
  "Planned tickets that are not Jira issues."
  skipped: Int!
}

type JoinGamePayload {
  boolean: Boolean
  errors: [JoinGameError!]
}

type JoinTeamPayload {
  boolean: Boolean
  errors: [JoinTeamError!]
}

type LeaveGamePayload {
  boolean: Boolean
  errors: [LeaveGameError!]
}

type LeaveTeamPayload {
  boolean: Boolean
  errors: [LeaveTeamError!]
}

"Days one member is available in the sprint (OPP-146)."
type MemberCapacityInfo {
  playerId: UUID!
  days: Float!
  "Nobody entered days for this member, so the whole sprint is assumed."
  isDefault: Boolean!
}

type MovePlanToJiraSprintPayload {
  jiraSprintMoved: JiraSprintMoved
  errors: [MovePlanToJiraSprintError!]
}

type MoveSortedTicketPayload {
  sortedTicket: SortedTicket
  errors: [MoveSortedTicketError!]
}

"Base Game Engine mutation."
type Mutation {
  "Sends a chat message to a game. Only players of the game can send messages."
  sendChatMessage(input: SendChatMessageInput!): SendChatMessagePayload! @cost(weight: "10")
  "Turns the assistant on or off for the room. Host and co-hosts."
  setAiAssistant(input: SetAiAssistantInput!): SetAiAssistantPayload! @cost(weight: "10")
  "Up to three points that are unclear in the ticket, shown to everyone in the room (OPP-150). Host and co-hosts."
  checkTicketClarity(input: CheckTicketClarityInput!): CheckTicketClarityPayload! @cost(weight: "10")
  "Clears the clarity points of a ticket for everyone. Host and co-hosts."
  dismissTicketClarity(input: DismissTicketClarityInput!): DismissTicketClarityPayload! @cost(weight: "10")
  "Two to four smaller tickets for one that is too big (OPP-151). Only the host sees them. Host and co-hosts."
  suggestTicketSplit(input: SuggestTicketSplitInput!): SuggestTicketSplitPayload! @cost(weight: "10")
  """
  A one-sentence summary of the voters' notes and the chat since the reveal (OPP-152), for the host to edit and keep.
  Player names are replaced before anything is sent. Host and co-hosts.
  """
  summarizeTicketDiscussion(input: SummarizeTicketDiscussionInput!): SummarizeTicketDiscussionPayload! @cost(weight: "10")
  "Keeps (or clears, with an empty text) the summary of a ticket; it goes into the tracker comment and the report. Host and co-hosts."
  setTicketDiscussionSummary(input: SetTicketDiscussionSummaryInput!): SetTicketDiscussionSummaryPayload! @cost(weight: "10")
  "Explains the current user's card after the reveal (up to 200 characters; empty clears it)."
  setVoteNote(input: SetVoteNoteInput!): SetVoteNotePayload! @cost(weight: "10")
  "Rates the current user's confidence (1–5) in the final estimate; null clears it."
  setConfidence(input: SetConfidenceInput!): SetConfidencePayload! @cost(weight: "10")
  "Marks a ticket as \"needs more information\" (or clears it). Host and co-hosts."
  setTicketNeedsInfo(input: SetTicketNeedsInfoInput!): SetTicketNeedsInfoPayload! @cost(weight: "10")
  """
  Discussion and look options of the room. Host and co-hosts. Celebrations, theme and seasonal cards keep
  their current value when left out.
  """
  updateFacilitationOptions(input: UpdateFacilitationOptionsInput!): UpdateFacilitationOptionsPayload! @cost(weight: "10")
  "Sends an emoji reaction to everyone in the room. Not stored."
  sendReaction(input: SendReactionInput!): SendReactionPayload! @cost(weight: "10")
  "Join Game. Requires a valid user token."
  joinGame(input: JoinGameInput!): JoinGamePayload! @cost(weight: "10")
  "Leave a Game. Requires a valid user token."
  leaveGame(input: LeaveGameInput!): LeaveGamePayload! @cost(weight: "10")
  """
  Switches between voting (PLAYER) and watching (OBSERVER). Players change their own role;
  the host and co-hosts can change anyone's. Leave playerId empty for yourself.
  """
  setPlayerRole(input: SetPlayerRoleInput!): SetPlayerRolePayload! @cost(weight: "10")
  "Picks your emoji avatar in this game from the fixed list, or clears it with null."
  setPlayerAvatar(input: SetPlayerAvatarInput!): SetPlayerAvatarPayload! @cost(weight: "10")
  "Makes a player co-host, or a regular player again. Host only."
  setCoHost(input: SetCoHostInput!): SetCoHostPayload! @cost(weight: "10")
  """
  Removes a player from the game (their votes stay). Host and co-hosts; the host cannot be removed.
  The removed player can join again with the link.
  """
  removePlayer(input: RemovePlayerInput!): RemovePlayerPayload! @cost(weight: "10")
  "Hands the game over to another player in it. Host only; the old host stays as a player."
  transferHost(input: TransferHostInput!): TransferHostPayload! @cost(weight: "10")
  "Creates a game, returns game details. The caller becomes the game host."
  createGame(input: CreateGameInput!): CreateGamePayload! @cost(weight: "10")
  "Deletes a game with its tickets, votes and players. Host only (not co-hosts)."
  deleteGame(input: DeleteGameInput!): DeleteGamePayload! @cost(weight: "10")
  "Generates a PDF report of the game. Only players of the game can generate it."
  generateGameReport(input: GenerateGameReportInput!): GenerateGameReportPayload! @cost(weight: "10")
  """
  Makes the caller the host of a game started from Slack or Teams, with the one-time link from the chat.
  False when the game already has a host or the link is not valid.
  """
  claimGameHost(input: ClaimGameHostInput!): ClaimGameHostPayload! @cost(weight: "10")
  "Finishes the Atlassian consent: stores the tokens (encrypted) and lists the caller's sites."
  completeJiraConnection(input: CompleteJiraConnectionInput!): CompleteJiraConnectionPayload! @cost(weight: "10")
  selectJiraSite(input: SelectJiraSiteInput!): SelectJiraSitePayload! @cost(weight: "10")
  "Deletes the caller's stored Jira tokens."
  disconnectJira: DisconnectJiraPayload! @cost(weight: "10")
  "Adds Jira issues as tickets; issues already in the game are skipped. Host or co-host only."
  importJiraIssues(input: ImportJiraIssuesInput!): ImportJiraIssuesPayload! @cost(weight: "10")
  """
  Writes the final estimate (or the most common card) to the Jira issue's story points; optionally adds a
  comment with the votes. Host or co-host only, after the reveal.
  """
  saveEstimateToJira(input: SaveEstimateToJiraInput!): SaveEstimateToJiraPayload! @cost(weight: "10")
  "Finishes the OAuth sign-in with the code and state from the callback."
  completeTrackerConnection(input: CompleteTrackerConnectionInput!): CompleteTrackerConnectionPayload! @cost(weight: "10")
  "Deletes the caller's tokens for the tracker."
  disconnectTracker(input: DisconnectTrackerInput!): DisconnectTrackerPayload! @cost(weight: "10")
  "Imports issues as tickets (all of the source when keys is empty), linked for \"Save to KEY\". Host and co-hosts."
  importTrackerIssues(input: ImportTrackerIssuesInput!): ImportTrackerIssuesPayload! @cost(weight: "10")
  "Writes the agreed estimate to the issue the ticket came from. Host and co-hosts."
  saveEstimateToTracker(input: SaveEstimateToTrackerInput!): SaveEstimateToTrackerPayload! @cost(weight: "10")
  "Dummy health-check mutation."
  ping: PingPayload! @cost(weight: "10")
  """
  Shares the recap of a game as a read-only link, or stops sharing it (the link stops working). Sharing again
  keeps the same link. Host and co-hosts.
  """
  setRecapSharing(input: SetRecapSharingInput!): SetRecapSharingPayload! @cost(weight: "10")
  "Creates Game Settings. Host only."
  createSettings(input: CreateSettingsInput!): CreateSettingsPayload! @cost(weight: "10")
  "Updates Game Settings. Host only."
  updateSettings(input: UpdateSettingsInput!): UpdateSettingsPayload! @cost(weight: "10")
  """
  Room options: auto-reveal, and the async voting window (players vote on all tickets on their own
  until asyncVotingEndsAt; null or a past time switches to meeting mode). Host and co-hosts.
  """
  updateGameOptions(input: UpdateGameOptionsInput!): UpdateGameOptionsPayload! @cost(weight: "10")
  "Opens or closes the sorting board for everyone in the room. Host and co-hosts."
  setSortingOpen(input: SetSortingOpenInput!): SetSortingOpenPayload! @cost(weight: "10")
  "Moves a ticket to a card column (an empty column moves it back to unsorted). Players, not observers."
  moveSortedTicket(input: MoveSortedTicketInput!): MoveSortedTicketPayload! @cost(weight: "10")
  "Clears the \"discuss\" mark of a ticket once the team agrees. Host and co-hosts."
  clearSortContested(input: ClearSortContestedInput!): ClearSortContestedPayload! @cost(weight: "10")
  """
  Sets the final estimate of every sorted ticket without one to its column's card. Contested and unsorted tickets
  are left as they are. Host and co-hosts.
  """
  applySortedEstimates(input: ApplySortedEstimatesInput!): ApplySortedEstimatesPayload! @cost(weight: "10")
  "Posts the session summary to the game's Slack thread or the team's webhook. Host and co-hosts."
  postSessionSummary(input: PostSessionSummaryInput!): PostSessionSummaryPayload! @cost(weight: "10")
  "Sets (or clears, with null) the Slack or Teams incoming webhook for session summaries. Team owner."
  setTeamSummaryWebhook(input: SetTeamSummaryWebhookInput!): SetTeamSummaryWebhookPayload! @cost(weight: "10")
  "Sets the working days of the sprint (1–30). Team owner only."
  setSprintDays(input: SetSprintDaysInput!): SetSprintDaysPayload! @cost(weight: "10")
  "Sets how many days a member is available (in half days). The owner for anyone, members for themselves."
  setMemberCapacity(input: SetMemberCapacityInput!): SetMemberCapacityPayload! @cost(weight: "10")
  "Puts a ticket into the sprint plan or takes it out. Team owner only."
  setTicketPlanned(input: SetTicketPlannedInput!): SetTicketPlannedPayload! @cost(weight: "10")
  """
  Moves the planned Jira tickets into a Jira sprint with the caller's Jira connection. Other tickets are skipped.
  Team owner only.
  """
  movePlanToJiraSprint(input: MovePlanToJiraSprintInput!): MovePlanToJiraSprintPayload! @cost(weight: "10")
  "Creates an API token for the team; the token is in the answer only (OPP-158). Team owner."
  createTeamApiToken(input: CreateTeamApiTokenInput!): CreateTeamApiTokenPayload! @cost(weight: "10")
  "Revokes an API token at once. Team owner."
  revokeTeamApiToken(input: RevokeTeamApiTokenInput!): RevokeTeamApiTokenPayload! @cost(weight: "10")
  "Adds an outgoing webhook; the signing secret is in the answer only (OPP-160). Team owner."
  createTeamWebhook(input: CreateTeamWebhookInput!): CreateTeamWebhookPayload! @cost(weight: "10")
  "Changes the address, the events or pauses a webhook. Team owner."
  updateTeamWebhook(input: UpdateTeamWebhookInput!): UpdateTeamWebhookPayload! @cost(weight: "10")
  "Makes a new signing secret; the old one stops working at once. Team owner."
  rotateTeamWebhookSecret(input: RotateTeamWebhookSecretInput!): RotateTeamWebhookSecretPayload! @cost(weight: "10")
  deleteTeamWebhook(input: DeleteTeamWebhookInput!): DeleteTeamWebhookPayload! @cost(weight: "10")
  "Pins an estimated ticket of the team's sprints as the reference for its card (two per card). Team members."
  pinTeamAnchor(input: PinTeamAnchorInput!): PinTeamAnchorPayload! @cost(weight: "10")
  "Removes a reference ticket. Team members."
  unpinTeamAnchor(input: UnpinTeamAnchorInput!): UnpinTeamAnchorPayload! @cost(weight: "10")
  "Starts the retro of a team sprint from a template (OPP-163). Team owner or the sprint's host."
  startRetro(input: StartRetroInput!): StartRetroPayload! @cost(weight: "10")
  "Names on cards and dots per person; only while writing (OPP-164, OPP-165). Host."
  updateRetroSettings(input: UpdateRetroSettingsInput!): UpdateRetroSettingsPayload! @cost(weight: "10")
  "Moves the retro to the next step: reveal, voting, results (OPP-164, OPP-165). Host."
  setRetroPhase(input: SetRetroPhaseInput!): SetRetroPhasePayload! @cost(weight: "10")
  "Writes a card in a column. Players of the sprint."
  addRetroCard(input: AddRetroCardInput!): AddRetroCardPayload! @cost(weight: "10")
  "Changes the text of one's own card."
  editRetroCard(input: EditRetroCardInput!): EditRetroCardPayload! @cost(weight: "10")
  "Deletes a card: its author, or the host."
  deleteRetroCard(input: DeleteRetroCardInput!): DeleteRetroCardPayload! @cost(weight: "10")
  "Drops a card onto another to group them; without a target it leaves its group (OPP-165). Players."
  groupRetroCard(input: GroupRetroCardInput!): GroupRetroCardPayload! @cost(weight: "10")
  "Names a group (the card that heads it). Players."
  setRetroGroupTitle(input: SetRetroGroupTitleInput!): SetRetroGroupTitlePayload! @cost(weight: "10")
  "Puts one dot on a card (or takes one back). Returns the dots left. Dots stay hidden until the results."
  voteRetroCard(input: VoteRetroCardInput!): VoteRetroCardPayload! @cost(weight: "10")
  "Adds an action item, optionally for a card and with an owner (OPP-166). Players."
  addRetroActionItem(input: AddRetroActionItemInput!): AddRetroActionItemPayload! @cost(weight: "10")
  "Changes the text or owner of an action item. Players of the team's sprint, or team members."
  updateRetroActionItem(input: UpdateRetroActionItemInput!): UpdateRetroActionItemPayload! @cost(weight: "10")
  "Marks an action item done or open again. Team members, from the retro or the team room."
  setRetroActionItemDone(input: SetRetroActionItemDoneInput!): SetRetroActionItemDonePayload! @cost(weight: "10")
  deleteRetroActionItem(input: DeleteRetroActionItemInput!): DeleteRetroActionItemPayload! @cost(weight: "10")
  "Posts a short summary to the team's Slack or Teams webhook (OPP-168). Host."
  postRetroSummary(input: PostRetroSummaryInput!): PostRetroSummaryPayload! @cost(weight: "10")
  "Creates a team room; the caller becomes its owner and first member."
  createTeam(input: CreateTeamInput!): CreateTeamPayload! @cost(weight: "10")
  "Renames a team room. Owner only."
  updateTeam(input: UpdateTeamInput!): UpdateTeamPayload! @cost(weight: "10")
  "Joins a team room with its link."
  joinTeam(input: JoinTeamInput!): JoinTeamPayload! @cost(weight: "10")
  "Leaves a team room. The owner cannot leave."
  leaveTeam(input: LeaveTeamInput!): LeaveTeamPayload! @cost(weight: "10")
  "Creates a ticket for given game. Host only."
  createTicket(input: CreateTicketInput!): CreateTicketPayload! @cost(weight: "10")
  """
  Creates a ticket for a Jira issue and links it to the issue, so "Save to KEY" works after the reveal. Used when
  a game is started from the Jira issue panel (OPP-120). Host only.
  """
  createTicketForIssue(input: CreateTicketForIssueInput!): CreateTicketForIssuePayload! @cost(weight: "10")
  "Updates a ticket's name and description. Host and co-hosts."
  updateTicket(input: UpdateTicketInput!): UpdateTicketPayload! @cost(weight: "10")
  "Puts the game's tickets in the given order (first id first). Host and co-hosts."
  reorderTickets(input: ReorderTicketsInput!): ReorderTicketsPayload! @cost(weight: "10")
  """
  Sets the estimate the team agreed on after the reveal (any value, usually a card). An empty value clears it.
  Host and co-hosts.
  """
  setFinalEstimate(input: SetFinalEstimateInput!): SetFinalEstimatePayload! @cost(weight: "10")
  """
  Re-votes a ticket: deletes its votes, hides voting again and broadcasts it as the
  active ticket to all players in the game. Host only.
  """
  reVoteTicket(input: ReVoteTicketInput!): ReVoteTicketPayload! @cost(weight: "10")
  "Deletes a ticket for given game. Host only."
  deleteTicket(input: DeleteTicketInput!): DeleteTicketPayload! @cost(weight: "10")
  "Starts (or restarts) the voting timer for everyone in the game. Host only."
  startTimer(input: StartTimerInput!): StartTimerPayload! @cost(weight: "10")
  "Stops the voting timer for everyone in the game. Host only."
  stopTimer(input: StopTimerInput!): StopTimerPayload! @cost(weight: "10")
  """
  Creates or updates a vote. Only players who joined the game can vote (observers cannot).
  With auto-reveal on, the last missing vote reveals the cards for everyone.
  """
  createOrUpdateVote(input: CreateOrUpdateVoteInput!): CreateOrUpdateVotePayload! @cost(weight: "10")
  "Reveals all votes for a ticket and broadcasts them to all players. Host and co-hosts."
  revealVotes(input: RevealVotesInput!): RevealVotesPayload! @cost(weight: "10")
}

type PinTeamAnchorPayload {
  teamAnchor: TeamAnchor
  errors: [PinTeamAnchorError!]
}

type PingPayload {
  string: String
}

type PlanTicketInfo {
  ticketId: UUID!
  name: String!
  externalKey: String
  externalUrl: String
  "Final estimate, or the most common card; null while not estimated."
  estimate: String
  "The estimate as a number; null for non-numeric cards."
  points: Float
  planned: Boolean!
}

"Suggested points for the sprint (OPP-147). A planning aid, not a target."
type PointBudgetInfo {
  "False with fewer than two past sprints: no suggestion yet."
  enoughHistory: Boolean!
  "Computed from points per person-day of past sprints with capacity; otherwise their average points."
  basedOnCapacity: Boolean!
  sprintsUsed: Int!
  suggested: Int
  low: Int
  high: Int
  pointsPerPersonDay: Float
}

type PostRetroSummaryPayload {
  boolean: Boolean
  errors: [PostRetroSummaryError!]
}

type PostSessionSummaryPayload {
