"Base Game Engine mutation."
type Mutation {
  "Sends a chat message to a game. Only players of the game can send messages."
  sendChatMessage(input: SendChatMessageInput!): SendChatMessagePayload! @cost(weight: "10")
  "Explains the current user's card after the reveal (up to 200 characters; empty clears it)."
  setVoteNote(input: SetVoteNoteInput!): SetVoteNotePayload! @cost(weight: "10")
  "Rates the current user's confidence (1–5) in the final estimate; null clears it."
  setConfidence(input: SetConfidenceInput!): SetConfidencePayload! @cost(weight: "10")
  "Marks a ticket as \"needs more information\" (or clears it). Host and co-hosts."
  setTicketNeedsInfo(input: SetTicketNeedsInfoInput!): SetTicketNeedsInfoPayload! @cost(weight: "10")
  "Discussion options of the room. Host and co-hosts."
  updateFacilitationOptions(input: UpdateFacilitationOptionsInput!): UpdateFacilitationOptionsPayload! @cost(weight: "10")
  "Sends an emoji reaction to everyone in the room. Not stored."
  sendReaction(input: SendReactionInput!): SendReactionPayload! @cost(weight: "10")
  "Join Game. Requires a valid user token."
  joinGame(input: JoinGameInput!): JoinGamePayload! @cost(weight: "10")
  "Leave a Game. Requires a valid user token."
  leaveGame(input: LeaveGameInput!): LeaveGamePayload! @cost(weight: "10")
  """
  Switches between voting (PLAYER) and watching (OBSERVER). Players change their own role;
  the host and co-hosts can change anyone's. Leave playerId empty for yourself.
  """
  setPlayerRole(input: SetPlayerRoleInput!): SetPlayerRolePayload! @cost(weight: "10")
  "Makes a player co-host, or a regular player again. Host only."
  setCoHost(input: SetCoHostInput!): SetCoHostPayload! @cost(weight: "10")
  """
  Removes a player from the game (their votes stay). Host and co-hosts; the host cannot be removed.
  The removed player can join again with the link.
  """
  removePlayer(input: RemovePlayerInput!): RemovePlayerPayload! @cost(weight: "10")
  "Hands the game over to another player in it. Host only; the old host stays as a player."
  transferHost(input: TransferHostInput!): TransferHostPayload! @cost(weight: "10")
  "Creates a game, returns game details. The caller becomes the game host."
  createGame(input: CreateGameInput!): CreateGamePayload! @cost(weight: "10")
  "Deletes a game with its tickets, votes and players. Host only (not co-hosts)."
  deleteGame(input: DeleteGameInput!): DeleteGamePayload! @cost(weight: "10")
  "Generates a PDF report of the game. Only players of the game can generate it."
  generateGameReport(input: GenerateGameReportInput!): GenerateGameReportPayload! @cost(weight: "10")
  """
  Makes the caller the host of a game started from Slack or Teams, with the one-time link from the chat.
  False when the game already has a host or the link is not valid.
  """
  claimGameHost(input: ClaimGameHostInput!): ClaimGameHostPayload! @cost(weight: "10")
  "Finishes the Atlassian consent: stores the tokens (encrypted) and lists the caller's sites."
  completeJiraConnection(input: CompleteJiraConnectionInput!): CompleteJiraConnectionPayload! @cost(weight: "10")
  selectJiraSite(input: SelectJiraSiteInput!): SelectJiraSitePayload! @cost(weight: "10")
  "Deletes the caller's stored Jira tokens."
  disconnectJira: DisconnectJiraPayload! @cost(weight: "10")
  "Adds Jira issues as tickets; issues already in the game are skipped. Host or co-host only."
  importJiraIssues(input: ImportJiraIssuesInput!): ImportJiraIssuesPayload! @cost(weight: "10")
  """
  Writes the final estimate (or the most common card) to the Jira issue's story points; optionally adds a
  comment with the votes. Host or co-host only, after the reveal.
  """
  saveEstimateToJira(input: SaveEstimateToJiraInput!): SaveEstimateToJiraPayload! @cost(weight: "10")
  "Finishes the OAuth sign-in with the code and state from the callback."
  completeTrackerConnection(input: CompleteTrackerConnectionInput!): CompleteTrackerConnectionPayload! @cost(weight: "10")
  "Deletes the caller's tokens for the tracker."
  disconnectTracker(input: DisconnectTrackerInput!): DisconnectTrackerPayload! @cost(weight: "10")
  "Imports issues as tickets (all of the source when keys is empty), linked for \"Save to KEY\". Host and co-hosts."
  importTrackerIssues(input: ImportTrackerIssuesInput!): ImportTrackerIssuesPayload! @cost(weight: "10")
  "Writes the agreed estimate to the issue the ticket came from. Host and co-hosts."
  saveEstimateToTracker(input: SaveEstimateToTrackerInput!): SaveEstimateToTrackerPayload! @cost(weight: "10")
  "Dummy health-check mutation."
  ping: PingPayload! @cost(weight: "10")
  "Creates Game Settings. Host only."
  createSettings(input: CreateSettingsInput!): CreateSettingsPayload! @cost(weight: "10")
  "Updates Game Settings. Host only."
  updateSettings(input: UpdateSettingsInput!): UpdateSettingsPayload! @cost(weight: "10")
  """
  Room options: auto-reveal, and the async voting window (players vote on all tickets on their own
  until asyncVotingEndsAt; null or a past time switches to meeting mode). Host and co-hosts.
  """
  updateGameOptions(input: UpdateGameOptionsInput!): UpdateGameOptionsPayload! @cost(weight: "10")
  "Opens or closes the sorting board for everyone in the room. Host and co-hosts."
  setSortingOpen(input: SetSortingOpenInput!): SetSortingOpenPayload! @cost(weight: "10")
  "Moves a ticket to a card column (an empty column moves it back to unsorted). Players, not observers."
  moveSortedTicket(input: MoveSortedTicketInput!): MoveSortedTicketPayload! @cost(weight: "10")
  "Clears the \"discuss\" mark of a ticket once the team agrees. Host and co-hosts."
  clearSortContested(input: ClearSortContestedInput!): ClearSortContestedPayload! @cost(weight: "10")
  """
  Sets the final estimate of every sorted ticket without one to its column's card. Contested and unsorted tickets
  are left as they are. Host and co-hosts.
  """
  applySortedEstimates(input: ApplySortedEstimatesInput!): ApplySortedEstimatesPayload! @cost(weight: "10")
  "Posts the session summary to the game's Slack thread or the team's webhook. Host and co-hosts."
  postSessionSummary(input: PostSessionSummaryInput!): PostSessionSummaryPayload! @cost(weight: "10")
  "Sets (or clears, with null) the Slack or Teams incoming webhook for session summaries. Team owner."
  setTeamSummaryWebhook(input: SetTeamSummaryWebhookInput!): SetTeamSummaryWebhookPayload! @cost(weight: "10")
  "Pins an estimated ticket of the team's sprints as the reference for its card (two per card). Team members."
  pinTeamAnchor(input: PinTeamAnchorInput!): PinTeamAnchorPayload! @cost(weight: "10")
  "Removes a reference ticket. Team members."
  unpinTeamAnchor(input: UnpinTeamAnchorInput!): UnpinTeamAnchorPayload! @cost(weight: "10")
  "Creates a team room; the caller becomes its owner and first member."
  createTeam(input: CreateTeamInput!): CreateTeamPayload! @cost(weight: "10")
  "Renames a team room. Owner only."
  updateTeam(input: UpdateTeamInput!): UpdateTeamPayload! @cost(weight: "10")
  "Joins a team room with its link."
  joinTeam(input: JoinTeamInput!): JoinTeamPayload! @cost(weight: "10")
  "Leaves a team room. The owner cannot leave."
  leaveTeam(input: LeaveTeamInput!): LeaveTeamPayload! @cost(weight: "10")
  "Creates a ticket for given game. Host only."
  createTicket(input: CreateTicketInput!): CreateTicketPayload! @cost(weight: "10")
  """
  Creates a ticket for a Jira issue and links it to the issue, so "Save to KEY" works after the reveal. Used when
  a game is started from the Jira issue panel (OPP-120). Host only.
  """
  createTicketForIssue(input: CreateTicketForIssueInput!): CreateTicketForIssuePayload! @cost(weight: "10")
  "Updates a ticket's name and description. Host and co-hosts."
  updateTicket(input: UpdateTicketInput!): UpdateTicketPayload! @cost(weight: "10")
  "Puts the game's tickets in the given order (first id first). Host and co-hosts."
  reorderTickets(input: ReorderTicketsInput!): ReorderTicketsPayload! @cost(weight: "10")
  """
  Sets the estimate the team agreed on after the reveal (any value, usually a card). An empty value clears it.
  Host and co-hosts.
  """
  setFinalEstimate(input: SetFinalEstimateInput!): SetFinalEstimatePayload! @cost(weight: "10")
  """
  Re-votes a ticket: deletes its votes, hides voting again and broadcasts it as the
  active ticket to all players in the game. Host only.
  """
  reVoteTicket(input: ReVoteTicketInput!): ReVoteTicketPayload! @cost(weight: "10")
  "Deletes a ticket for given game. Host only."
  deleteTicket(input: DeleteTicketInput!): DeleteTicketPayload! @cost(weight: "10")
  "Starts (or restarts) the voting timer for everyone in the game. Host only."
  startTimer(input: StartTimerInput!): StartTimerPayload! @cost(weight: "10")
  "Stops the voting timer for everyone in the game. Host only."
  stopTimer(input: StopTimerInput!): StopTimerPayload! @cost(weight: "10")
  """
  Creates or updates a vote. Only players who joined the game can vote (observers cannot).
  With auto-reveal on, the last missing vote reveals the cards for everyone.
  """
  createOrUpdateVote(input: CreateOrUpdateVoteInput!): CreateOrUpdateVotePayload! @cost(weight: "10")
  "Reveals all votes for a ticket and broadcasts them to all players. Host and co-hosts."
  revealVotes(input: RevealVotesInput!): RevealVotesPayload! @cost(weight: "10")
}

type PinTeamAnchorPayload {
  teamAnchor: TeamAnchor
  errors: [PinTeamAnchorError!]
}

type PingPayload {
  string: String
}

type PostSessionSummaryPayload {
  sessionSummaryInfo: SessionSummaryInfo
  errors: [PostSessionSummaryError!]
}

"Base Game Engine query."
type Query {
  """
  Returns recent chat messages for a game (from Redis, 24h TTL). Empty for callers who are not
  players of the game.
  """
  chatMessages(gameId: UUID!): [ChatMessage!]! @cost(weight: "10")
  "Discussion data of a ticket. Players of the game only."
  ticketFacilitation(ticketId: UUID!): TicketFacilitationResult! @cost(weight: "10")
  "Returns game with participants"
  gamePlayers(gameId: UUID!): GamePlayersResult! @cost(weight: "10")
  "Returns Game details."
  game(id: UUID!): GameResult! @cost(weight: "10")
  "Returns an info about the Game Engine service."
  info: InfoResult! @cost(weight: "10")
  "Whether the integration is available and the caller has connected Jira."
  jiraConnection: JiraConnectionStatus! @cost(weight: "10")
  "The Atlassian consent page to open; it returns to the app's Jira callback, then to returnPath."
  jiraAuthorizeUrl(returnPath: String!): JiraAuthorizeUrlResult!
  jiraSites: JiraSitesResult! @cost(weight: "10")
  jiraBoards: JiraBoardsResult! @cost(weight: "10")
  jiraSprints(boardId: Long!): JiraSprintsResult! @cost(weight: "10")
  """
  Import preview: a sprint's issues, a board's open issues, or a JQL query, with the issues that are already
  tickets of the game marked. Host or co-host only.
  """
  jiraIssues(gameId: UUID! boardId: Long sprintId: Long jql: String): JiraIssuesResult! @cost(weight: "10")
  "The trackers this server offers, with the caller's connection to each."
  trackers: [TrackerInfo!]! @cost(weight: "10")
  "The tracker's consent page; it returns to \/integrations\/tracker\/{provider}\/callback, then to returnPath."
  trackerAuthorizeUrl(provider: String! returnPath: String!): TrackerAuthorizeUrlResult!
  "Repositories, teams or projects to import from."
  trackerSources(provider: String!): TrackerSourcesResult! @cost(weight: "10")
  "Import preview: up to 100 issues of a source, marking those already in the game. Host and co-hosts."
  trackerIssues(provider: String! gameId: UUID! sourceId: String! query: String): TrackerIssuesResult! @cost(weight: "10")
  "Dummy health-check query."
  ping: String! @cost(weight: "10")
  "Gets Game Settings."
  settings(gameId: UUID!): SettingsResult! @cost(weight: "10")
  "The sorting board of a game. Players of the game only."
  sortingBoard(gameId: UUID!): SortingBoardResult! @cost(weight: "10")
  "Cycle times per card from Jira, with the caller's Jira connection. Team members."
  teamAccuracy(teamId: UUID!): TeamAccuracyResult! @cost(weight: "10")
  "Preview of the session summary and where it would go. Host and co-hosts."
  sessionSummary(gameId: UUID!): SessionSummaryResult! @cost(weight: "10")
  "The team's anchors and up to three similar past tickets for a ticket. Players of the game only."
  ticketReference(ticketId: UUID!): TicketReferenceResult! @cost(weight: "10")
  "A team room by id. Members-only fields are empty for others."
  team(id: UUID!): TeamResult! @cost(weight: "10")
  "Team rooms the caller belongs to."
  myTeams: [Team!]! @cost(weight: "10")
  "Gets a ticket by id."
  ticket(id: UUID!): TicketResult! @cost(weight: "10")
  "Gets a list of tickets by gameId."
  tickets(gameId: UUID!): TicketsResult! @cost(weight: "10")
  """
  Current voting timer of a game, for players who join while it runs. Null when there is none
  or the caller is not a player of the game.
  """
  gameTimer(gameId: UUID!): GameTimer @cost(weight: "10")
  "Gets votes by ticketId."
  votes(ticketId: UUID!): VotesResult! @cost(weight: "10")
}

