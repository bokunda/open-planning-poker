# Monitoring stack (OpenTelemetry collector, Prometheus, Loki, Promtail, Grafana).
# All ports are published on 127.0.0.1 only: Grafana is reached through nginx
# (grafana.openplanningpoker.com), and the app containers send OTLP to
# http://otel-collector:4317 over the shared `oppnetwork` Docker network.

networks:
  monitoring:
    driver: bridge
  # Network of the application containers (created by the app deploy workflows).
  oppnetwork:
    external: true

volumes:
  prometheus-data:
    driver: local
  # Grafana users, dashboards and settings. Without this volume they lived only
  # inside the container and were lost whenever it was recreated.
  grafana-data:
    driver: local

services:
  otel-collector:
    image: otel/opentelemetry-collector:0.95.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:4317:4317"
    restart: unless-stopped
    networks:
      - monitoring
      - oppnetwork
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9050:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      # A month of history for the website report (OPP-181), with room to spare.
      - '--storage.tsdb.retention.time=45d'
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - monitoring
  loki:
    image: grafana/loki:2.9.4
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - /var/log:/var/log
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.openplanningpoker.com
      # Email alerts (OPP-35). The values come from GitHub secrets in the monitoring deploy.
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-}
      - GF_SMTP_FROM_NAME=Open Planning Poker alerts
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      - OPP_ALERT_EMAIL=${OPP_ALERT_EMAIL:-}
    image: grafana/grafana:11.5.2
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Data sources, the 5xx alert and its email contact point.
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - monitoring
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.5.0
    container_name: node_exporter
    command: '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
