# OPP-35: the gateway, the Game Engine or User Management answers more than 2% of requests with a
# 5xx status for 5 minutes. One alert per service (exported_job is the OpenTelemetry service name).
apiVersion: 1
groups:
  - orgId: 1
    name: opp-http
    folder: Open Planning Poker
    interval: 1m
    rules:
      - uid: opp-5xx-rate
        title: 5xx responses above 2%
        condition: above
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} answered {{ humanizePercentage $values.ratio.Value }} of requests with a 5xx status in the last 5 minutes.'
          description: Server errors on {{ $labels.service }} stayed above 2% for 5 minutes.
          logs: 'https://grafana.openplanningpoker.com/explore?schemaVersion=1&panes=%7B%22l%22%3A%7B%22datasource%22%3A%22Loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bjob%3D~%5C%22.%2B%5C%22%7D%20%7C~%20%5C%22(%3Fi)error%7Cexception%5C%22%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-30m%22%2C%22to%22%3A%22now%22%7D%7D%7D&orgId=1'
          metrics: 'https://grafana.openplanningpoker.com/explore?schemaVersion=1&panes=%7B%22m%22%3A%7B%22datasource%22%3A%22opp-prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22sum%20by%20(exported_job%2C%20http_response_status_code)%20(rate(http_server_request_duration_seconds_count%5B5m%5D))%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D&orgId=1'
        data:
          - refId: errors
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: opp-prometheus
            model:
              refId: errors
              instant: true
              expr: >-
                label_replace(sum by (exported_job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])),
                "service", "$1", "exported_job", "(.*)")
          - refId: total
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: opp-prometheus
            model:
              refId: total
              instant: true
              expr: >-
                label_replace(sum by (exported_job) (rate(http_server_request_duration_seconds_count[5m])),
                "service", "$1", "exported_job", "(.*)")
          - refId: ratio
            datasourceUid: __expr__
            model:
              refId: ratio
              type: math
              expression: $errors / $total
          - refId: above
            datasourceUid: __expr__
            model:
              refId: above
              type: threshold
              expression: ratio
              conditions:
                - evaluator: { type: gt, params: [0.02] }
