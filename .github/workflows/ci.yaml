name: CI
run-name: "CI — ${{ github.event.pull_request.title || github.ref_name }}"

# Every pull request: backend unit and integration tests, app and website builds, end-to-end tests
# (Playwright + axe) against the full stack, and Lighthouse budgets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Did the backend change?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - open-planning-poker-game-engine
          - open-planning-poker-user-management
          - open-planning-poker-graphql-gateway
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 9.0.x
      - name: Build
        working-directory: backend/${{ matrix.service }}
        run: dotnet build -c Release
      - name: Test (unit, architecture, schema and Testcontainers integration tests)
        if: matrix.service != 'open-planning-poker-graphql-gateway'
        working-directory: backend/${{ matrix.service }}
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - name: No vulnerable packages
        working-directory: backend/${{ matrix.service }}
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: App — install and build
        working-directory: frontend/open-planning-poker-web-app
        run: |
          npm ci --legacy-peer-deps
          node scripts/check-i18n.mjs
          npm run build
      - name: Website — install and build
        working-directory: frontend/open-planning-poker-website
        run: |
          npm ci
          npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Start the backend (PostgreSQL, Redis, subgraphs, gateway)
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300

      - name: Build the app against the local backend
        working-directory: frontend/open-planning-poker-web-app
        run: |
          npm ci --legacy-peer-deps
          npx ng build --configuration e2e

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST http://localhost:10010/graphql -H 'Content-Type: application/json' \
                 -d '{"query":"{ __typename }"}' > /dev/null; then echo "gateway is up"; exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.e2e.yml logs --tail 100
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe)
        working-directory: e2e
        run: npx playwright test

      - name: Build the website
        working-directory: frontend/open-planning-poker-website
        run: |
          npm ci
          npm run build

      - name: Lighthouse budgets
        working-directory: e2e
        run: |
          (cd ../frontend/open-planning-poker-web-app && PORT=4000 node dist/open-planning-poker-ui/server/server.mjs &)
          npx --yes http-server@14.1.1 ../frontend/open-planning-poker-website/dist -p 8080 -s &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/game > /dev/null && curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done

          # A real game room: register an anonymous user and create a game through the gateway.
          gql() { curl -sf -X POST http://localhost:10010/graphql -H 'Content-Type: application/json' -H "Authorization: Bearer $2" -d "$1"; }
          TOKEN=$(gql '{"query":"mutation { registerUser(input: { username: \"\" }) { registerUserResponse { token } } }"}' "" \
            | jq -r '.data.registerUser.registerUserResponse.token')
          GAME=$(gql '{"query":"mutation { createGame(input: { name: \"Lighthouse\", description: \"\" }) { game { id } } }"}' "$TOKEN" \
            | jq -r '.data.createGame.game.id')
          echo "Game room: $GAME"
          LHCI_GAME_URL="http://localhost:4000/game/$GAME" npx lhci autorun --config=lighthouserc.cjs

      - name: Backend logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail 200

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-reports
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/lighthouse-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the backend
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
