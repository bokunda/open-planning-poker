name: Deploy OPP
run-name: "Deploying Open Planning Poker Game - Build #${{ github.run_number }}"
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  opp-um:
    name: Deploy OPP User Management
    uses: ./.github/workflows/deploy-opp-user-management.yaml
    secrets: 
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
      OPP_JWT_SECRET: ${{ secrets.OPP_JWT_SECRET }}
  opp-ge:
    name: Deploy OPP Game Engine
    uses: ./.github/workflows/deploy-opp-game-engine.yaml
    secrets: 
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD  }}
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
      OPP_JWT_SECRET: ${{ secrets.OPP_JWT_SECRET }}
  opp-graphql-gtw:
    name: Deploy OPP GraphQL Gateway
    needs: [opp-um, opp-ge]
    uses: ./.github/workflows/deploy-opp-gateway.yaml
    secrets: 
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
  opp-ui:
    name: Deploy OPP UI
    needs: [opp-graphql-gtw]
    uses: ./.github/workflows/deploy-opp-ui.yaml
    secrets: 
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}

  # The website shows the changelog and the version, so it is rebuilt with every release.
  opp-website:
    name: Deploy OPP Website
    needs: [opp-ui]
    uses: ./.github/workflows/deploy-opp-website.yaml
    secrets:
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}

  indexnow:
    name: Ping Search Engines
    needs: [opp-ui, opp-website]
    runs-on: ubuntu-24.04
    steps:
      - name: Ping IndexNow (Bing + Yandex)
        run: |
          curl -s "https://www.bing.com/indexnow?url=https://openplanningpoker.com/&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://app.openplanningpoker.com/&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://openplanningpoker.com/changelog/&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://openplanningpoker.com/what-is-planning-poker/&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://openplanningpoker.com/how-to-run-planning-poker/&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://openplanningpoker.com/planning-poker-cards/&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://openplanningpoker.com/self-hosted-planning-poker/&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://openplanningpoker.com/sitemap.xml&key=${{ secrets.INDEX_NOW }}"
          curl -s "https://www.bing.com/indexnow?url=https://app.openplanningpoker.com/sitemap.xml&key=${{ secrets.INDEX_NOW }}"
