name: Deploy Monitoring Services
run-name: "Deploying monitoring services to server"
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SSH_PASSWORD: 
        required: true
jobs:
  deploy-monitoring-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Copy code to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "backend/open-planning-poker-monitoring-services"
          target: "/home/${{ vars.SSH_USER }}/opp-metrics"
          # Place the compose file and config/ directly in opp-metrics (as on the server).
          strip_components: 2
      
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/${{ vars.SSH_USER }}/opp-metrics
            # The OTel collector joins the app network so containers reach it as otel-collector:4317.
            docker network inspect oppnetwork >/dev/null 2>&1 || docker network create oppnetwork
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f

