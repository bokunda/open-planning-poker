name: Deploy Monitoring Services
run-name: "Deploying monitoring services to server"
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SSH_DEPLOY_KEY:
        required: true
jobs:
  deploy-monitoring-services:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Copy code to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: "backend/open-planning-poker-monitoring-services"
          target: "/home/${{ vars.SSH_USER }}/opp-metrics"
          # Place the compose file and config/ directly in opp-metrics (as on the server).
          strip_components: 2
      
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        # Email for Grafana alerts (OPP-35). Without SMTP_HOST the alerts still run, but nothing is sent.
        env:
          GF_SMTP_ENABLED: ${{ secrets.SMTP_HOST != '' }}
          GF_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          GF_SMTP_USER: ${{ secrets.SMTP_USER }}
          GF_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GF_SMTP_FROM_ADDRESS: ${{ vars.SMTP_FROM_ADDRESS }}
          OPP_ALERT_EMAIL: ${{ vars.OPP_ALERT_EMAIL }}
        with:
          envs: GF_SMTP_ENABLED,GF_SMTP_HOST,GF_SMTP_USER,GF_SMTP_PASSWORD,GF_SMTP_FROM_ADDRESS,OPP_ALERT_EMAIL
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd /home/${{ vars.SSH_USER }}/opp-metrics
            # The OTel collector joins the app network so containers reach it as otel-collector:4317.
            docker network inspect oppnetwork >/dev/null 2>&1 || docker network create oppnetwork
            docker compose pull
            docker compose up -d --remove-orphans
            # The alert and its contact point are provisioned: fail the deploy if Grafana rejected them.
            sleep 15
            if docker compose logs grafana 2>&1 | grep -iE "provisioning.(alerting|datasources)" | grep -iE "level=error|failed"; then exit 1; fi
            docker system prune -f

