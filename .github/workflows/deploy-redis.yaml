name: Deploy Redis
run-name: "Deploying Redis to server"
on:
  workflow_dispatch:
jobs:
  deploy-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Verify required secrets
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          if [ ${#REDIS_PASSWORD} -lt 24 ]; then echo "::error::REDIS_PASSWORD must be set and at least 24 characters"; exit 1; fi

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_PRIVATE_HOST }}
          username: ${{ vars.SSH_PRIVATE_USER }}
          password: ${{ secrets.SSH_PRIVATE_PASSWORD }}
          script: |
            docker pull redis:7.4-alpine
            docker rm -f OpenPlanningPoker.Cache || true
            # Redis is reached from the public app server, so the port stays published:
            # it is protected by a password, and the firewall must only allow the app server's IP.
            docker run -d --restart unless-stopped --name OpenPlanningPoker.Cache --network oppnetwork \
              -p 6379:6379 \
              redis:7.4-alpine \
              redis-server --requirepass '${{ secrets.REDIS_PASSWORD }}' --protected-mode yes
            docker system prune -f

