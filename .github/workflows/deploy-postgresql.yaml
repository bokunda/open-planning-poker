name: Deploy PostgreSQL
run-name: "Deploying PostgreSQL - Build #${{ github.run_number }}"
on:
  workflow_dispatch:
jobs:
  deploy-postgresql:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        with:
          # The private server is reached through the app server over the private network.
          host: ${{ vars.OPP_DB_HOST }}
          username: ${{ vars.SSH_PRIVATE_USER }}
          key: ${{ secrets.SSH_PRIVATE_DEPLOY_KEY }}
          proxy_host: ${{ vars.SSH_HOST }}
          proxy_username: ${{ vars.SSH_USER }}
          proxy_key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            docker pull postgres:15.5
            docker rm -f OpenPlanningPoker.Db || true
            docker run -d \
              --restart unless-stopped \
              --name OpenPlanningPoker.Db \
              --network oppnetwork \
              -e POSTGRES_DB=${{ vars.POSTGRES_DB }} \
              -e POSTGRES_USER=${{ vars.POSTGRES_USER }} \
              -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              -v /path/to/database:/var/lib/postgresql/data \
              -p 5432:5432 \
              postgres:15.5
            docker system prune -f

