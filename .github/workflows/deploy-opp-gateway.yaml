name: Deploy OPP Gateway
run-name: "Deploying Open Planning Poker Gateway - Build #${{ github.run_number }}"
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SSH_DEPLOY_KEY:
        required: true
jobs:
  deploy-opp-gateway:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Set connection string in appsettings.json
        working-directory: backend/open-planning-poker-graphql-gateway
        run: |
          jq '.Cors.AllowedOrigins = ${{ vars.OPP_DEFAULT_CORS }} |
              .Otel.Endpoint = "${{ vars.OTEL_ENDPOINT }}"
              ' appsettings.json > temp.json && mv temp.json appsettings.json

      - name: Install the Nitro CLI (Fusion v2 composition)
        run: |
          dotnet tool install -g ChilliCream.Nitro.CommandLine --version 16.7.7

      # Exports both subgraph schemas and composes the gateway.far that the Docker image copies, so every
      # deploy serves the current subgraph schemas. Subgraph names and Docker DNS addresses come from each
      # subgraph's schema-settings.json: the gateway reaches them over the oppnetwork Docker network.
      - name: Compose Schema
        working-directory: backend/open-planning-poker-graphql-gateway
        run: |
          ./compose-gateway.sh
          unzip -p gateway.far gateway/2.0.0/gateway.graphqls > composed.graphqls
          grep -q "votesRevealed" composed.graphqls && grep -q "onTimerChanged" composed.graphqls && grep -q "onGameChanged" composed.graphqls && grep -q "activityLog" composed.graphqls || { echo "::error::Composed gateway schema is missing expected fields"; exit 1; }
          grep -q "@fusion__cost_options(defaultListSize: 1)" composed.graphqls || { echo "::error::gateway.far lost its defaultListSize composition setting (see fusion-commands.md)"; exit 1; }
          rm composed.graphqls
          unzip -p gateway.far gateway/2.0.0/gateway-settings.json

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        working-directory: backend/open-planning-poker-graphql-gateway
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/openplanningpokergatewaygraphql:${{ github.run_number }} -f ./Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/openplanningpokergatewaygraphql:${{ github.run_number }}

          docker build -t ghcr.io/${{ github.repository_owner }}/openplanningpokergatewaygraphql:latest -f ./Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/openplanningpokergatewaygraphql:latest

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/${{ github.repository_owner }}/openplanningpokergatewaygraphql:${{ github.run_number }}
            docker rm -f OpenPlanningPoker.Fusion.Gateway || true
            docker run -d \
              --restart unless-stopped \
              --name OpenPlanningPoker.Fusion.Gateway \
              --network oppnetwork \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_HTTP_PORTS=8080 \
              -e OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_ENDPOINT }} \
              -p 127.0.0.1:10010:8080 \
              -p 127.0.0.1:10011:8081 \
              ghcr.io/${{ github.repository_owner }}/openplanningpokergatewaygraphql:${{ github.run_number }}

