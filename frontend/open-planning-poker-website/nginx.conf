server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted stylesheet (output.<hash>.css) and fonts never change under the same name.
    location ~* \.(css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images keep their names when a screenshot is replaced, so cache them for a week.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Agent discovery manifest must be served as JSON, not the HTML fallback.
    location = /.well-known/ai-catalog.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML and other files: short cache. Unknown paths get a real 404 (not the home page),
    # so search engines do not index them as duplicates.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
