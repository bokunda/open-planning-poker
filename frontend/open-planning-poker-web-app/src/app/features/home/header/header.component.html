<header class="header-wrapper">
  <div class="header">
    <mat-toolbar>
      <!-- Hamburger menu -->
      <button mat-icon-button [matMenuTriggerFor]="moreMenu" aria-label="Menu">
        <mat-icon>menu</mat-icon>
      </button>

      <a class="header-brand" routerLink="/" aria-label="Open Planning Poker, home">
        <img class="header-logo" src="/open-planning-poker-game-logo-64x64.png" alt="" width="28" height="28">
        <span class="header-brand-text">Open Planning <span class="header-brand-accent">Poker</span></span>
      </a>
      <span class="header-spacer"></span>

      <a class="opp-support-btn header-support" [href]="support.koFi" target="_blank" rel="noopener noreferrer"
        oppDonate="ko_fi" oppDonatePlacement="header" aria-label="Buy me a coffee: support Open Planning Poker on Ko-fi">
        <mat-icon svgIcon="opp-coffee" aria-hidden="true"></mat-icon>
        <span class="header-support-label">Buy me a coffee</span>
      </a>

      <!-- Username -->
      <!-- One button: the name and the pencil (a button inside a button is not accessible). -->
      <button type="button" class="header-welcome" *ngIf="username" (click)="handleUpdateUser()" [attr.aria-label]="'Edit username, currently ' + username">
        <span class="header-avatar" aria-hidden="true">{{ username.charAt(0).toUpperCase() }}</span>
        <span class="header-username">{{ username }}</span>
        <mat-icon class="header-edit-icon" aria-hidden="true">edit</mat-icon>
      </button>

      <mat-menu #moreMenu="matMenu">
        <button mat-menu-item (click)="toggleTheme()">
          <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
          <span>{{ isDark ? 'Light mode' : 'Dark mode' }}</span>
        </button>
        <a mat-menu-item routerLink="/team">
          <mat-icon svgIcon="opp-team"></mat-icon>
          <span>Team rooms</span>
        </a>
        <mat-divider></mat-divider>
        <a mat-menu-item [href]="support.koFi" target="_blank" rel="noopener noreferrer" oppDonate="ko_fi" oppDonatePlacement="header_menu">
          <mat-icon svgIcon="opp-coffee"></mat-icon>
          <span>Buy me a coffee</span>
        </a>
        <a mat-menu-item [href]="support.githubSponsors" target="_blank" rel="noopener noreferrer" oppDonate="github_sponsors" oppDonatePlacement="header_menu">
          <mat-icon svgIcon="opp-heart"></mat-icon>
          <span>Sponsor on GitHub</span>
        </a>
        <mat-divider></mat-divider>
        <a mat-menu-item href="{{githubRepoUrl}}" target="_blank" rel="noopener noreferrer">
          <mat-icon svgIcon="github"></mat-icon>
          <span>GitHub</span>
        </a>
        <a mat-menu-item href="{{websiteUrl}}" target="_blank" rel="noopener noreferrer">
          <mat-icon>language</mat-icon>
          <span>Website</span>
        </a>
        <button mat-menu-item (click)="openInfoDialog()">
          <mat-icon>info</mat-icon>
          <span>About</span>
        </button>
      </mat-menu>
    </mat-toolbar>
  </div>
</header>
