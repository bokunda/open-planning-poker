<div class="update-user-wrapper">
  <div class="update-user">
    <form [formGroup]="updateUserForm" (ngSubmit)="onSubmit()" class="update-user-form">
      <mat-form-field appearance="outline">
        <mat-label>Your name</mat-label>
        <input matInput formControlName="username" cdkFocusInitial>
      </mat-form-field>

      <button mat-flat-button color="primary" class="opp-submit" type="submit">
        Save name
      </button>
    </form>

  </div>
</div>
