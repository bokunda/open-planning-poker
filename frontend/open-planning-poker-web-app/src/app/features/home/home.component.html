<div class="home-wrapper">
  <div class="home">
    <app-header [username]="username"></app-header>
    <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
    @if (isTeamView) {
    <!-- Separate chunk: the game pages do not download the team rooms. -->
    @defer (on immediate) {
    <app-team class="center" [currentUserId]="userId"></app-team>
    }
    } @else {
    <app-game class="center" style="width:100%" [currentUserId]="userId" [currentUserName]="username"></app-game>
    }
    <app-footer></app-footer>
  </div>
</div>
