@if (isHost || running) {
<div class="timer" [class.timer--running]="running" [class.timer--warning]="warning" role="group" [attr.aria-label]="'timer.aria' | transloco">
  <span class="timer-readout">
    <svg class="timer-clock" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2M9.5 2.5h5M12 2.5V6"/>
    </svg>
    <span class="timer-time">{{ display }}</span>
    @if (running) { <span class="sr-only">{{ 'timer.leftWord' | transloco }}</span> }
  </span>

  @if (isHost) {
  <div class="timer-durations" role="radiogroup" [attr.aria-label]="'timer.duration' | transloco">
    @for (seconds of durations; track seconds) {
    <button type="button" class="timer-duration" role="radio"
      [attr.aria-checked]="seconds === duration" [class.timer-duration--active]="seconds === duration"
      [disabled]="running || busy" (click)="pick(seconds)">{{ label(seconds) }}</button>
    }
  </div>
  @if (!running) {
  <button type="button" class="timer-action" (click)="start()" [disabled]="busy">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    {{ 'timer.start' | transloco }}
  </button>
  } @else {
  <button type="button" class="timer-action timer-action--stop" (click)="stop()" [disabled]="busy">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
    {{ 'timer.stop' | transloco }}
  </button>
  }
  } @else {
  <span class="timer-note" aria-hidden="true">{{ 'timer.leftWord' | transloco }}</span>
  }
</div>
}
