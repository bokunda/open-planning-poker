<section class="voting-wrapper" aria-label="Voting area">
  <div class="sr-only" aria-live="polite" aria-atomic="true">{{ announcement }}</div>
  <!-- No ticket: big CTA for host -->
  <div class="no-ticket-cta" *ngIf="!ticket?.id && isHost">
    <div class="no-ticket-illustration">🎯</div>
    <h2 class="no-ticket-title">Ready to start?</h2>
    <p class="no-ticket-desc">Create your first ticket to begin estimating.</p>
    <div class="no-ticket-actions">
      <button mat-raised-button color="primary" class="new-ticket-btn--hero" (click)="handleOnCreateNewTicket()">
        <mat-icon>add</mat-icon> New ticket
      </button>
      <button mat-stroked-button color="primary" class="new-ticket-btn--hero" (click)="handleOnImportTickets()">
        <mat-icon>file_upload</mat-icon> Import tickets
      </button>
    </div>
  </div>

  <!-- No ticket: waiting message for non-host -->
  <div class="no-ticket-waiting" *ngIf="!ticket?.id && !isHost">
    <span class="waiting-icon">⏳</span>
    <ng-container *ngIf="tickets.length > 0; else noTicketsYet">
      <p>Host has created tickets. Waiting for host to select a ticket...</p>
    </ng-container>
    <ng-template #noTicketsYet>
      <p>Waiting for host to create a ticket...</p>
    </ng-template>
  </div>

  <!-- Active ticket -->
  <ng-container *ngIf="ticket?.id">
    <div class="voting-item-details">
      <div class="ticket-nav">
        <button
          mat-icon-button
          class="ticket-nav-btn"
          [disabled]="!hasPrevTicket"
          (click)="navigateToTicket(prevTicketId)"
          aria-label="Previous ticket">
          <mat-icon>chevron_left</mat-icon>
        </button>

        <div class="ticket-info">
          <h2 class="ticket-name">
            {{ticket?.name}}
            <button
              *ngIf="ticket?.description"
              mat-icon-button
              class="ticket-desc-toggle"
              [class.ticket-desc-toggle--active]="descriptionExpanded"
              (click)="toggleDescription()"
              aria-label="Toggle ticket description"
              matTooltip="View description">
              <mat-icon>info</mat-icon>
            </button>
          </h2>
          <div class="ticket-description" *ngIf="ticket?.description" [class.ticket-description--expanded]="descriptionExpanded">
            <p *ngFor="let paragraph of ticket!.description!.split('\n')" class="ticket-description-p">{{ paragraph }}</p>
          </div>
        </div>

        <button
          mat-icon-button
          class="ticket-nav-btn"
          [disabled]="!hasNextTicket"
          (click)="navigateToTicket(nextTicketId)"
          aria-label="Next ticket">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>

    <!-- Timer: the host runs it, everyone sees the countdown. Hidden (not destroyed) after the reveal. -->
    <app-game-timer class="voting-timer" [hidden]="votesRevealed" [gameId]="gameId" [isHost]="isHost"
      (tick)="onTimerTick($event)" (expired)="onTimerExpired()"></app-game-timer>

    <app-poker-table
      [players]="players"
      [votes]="votes"
      [votesRevealed]="votesRevealed"
      [currentUserId]="currentUserId"
      [deck]="voteOptions"
      [hideMyCard]="cardInFlight"
      [timerRemaining]="votesRevealed ? null : timerTick.remaining"
      [timerTotal]="timerTick.total">
    </app-poker-table>

    <div class="voting-cards" role="group" aria-label="Your cards. Use the arrow keys to move and Enter to vote."
      [class.voting-cards--locked]="votesRevealed" (keydown)="onHandKeydown($event)">
      <button *ngFor="let voteOption of voteOptions; let i = index; trackBy: trackByOption"
        #voteButton
        type="button"
        [attr.tabindex]="i === tabStopIndex ? 0 : -1"
        class="vote-card"
        [class.vote-card--selected]="selectedOption === voteOption"
        [class.vote-card--disabled]="ticket?.id == null"
        [disabled]="ticket?.id == null || votesRevealed"
        [attr.aria-pressed]="selectedOption === voteOption"
        [attr.aria-label]="'Vote ' + voteOption"
        (click)="selectOption(voteOption, $event)">
        <app-poker-card [value]="voteOption" size="lg" [selected]="selectedOption === voteOption"></app-poker-card>
      </button>
    </div>
    <p class="hand-hint" *ngIf="!votesRevealed">Tip: type a card's value to vote, or use ← → and Enter.</p>

    <!-- Host action bar (below vote cards) -->
    <div class="voting-actions" *ngIf="isHost">
      <!-- Pre-reveal: has votes -->
      <ng-container *ngIf="!votesRevealed && votes.length > 0">
        <button mat-flat-button color="primary" class="action-btn action-btn--reveal" (click)="onRevealVotes.emit()">
          <mat-icon>visibility</mat-icon> Reveal cards
        </button>
      </ng-container>

      <!-- Post-reveal: vote again -->
      <button mat-flat-button color="primary" class="action-btn" *ngIf="votesRevealed" (click)="onVoteAgain.emit()">
        <mat-icon>replay</mat-icon> Vote again
      </button>

      <!-- Always available -->
      <button mat-stroked-button color="primary" class="action-btn" (click)="handleOnCreateNewTicket()">
        <mat-icon>add</mat-icon> New ticket
      </button>
      <button mat-stroked-button class="action-btn action-btn--import" (click)="handleOnImportTickets()">
        <mat-icon>file_upload</mat-icon> Import
      </button>
    </div>

    <app-vote-results *ngIf="votesRevealed" [votes]="votes" [players]="players" [deck]="voteOptions"></app-vote-results>
  </ng-container>
</section>
