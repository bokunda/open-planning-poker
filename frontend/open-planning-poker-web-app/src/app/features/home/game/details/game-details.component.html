<section class="game-details-wrapper" *ngIf="game" aria-label="Game details">
  <div class="game-details">
    <div class="game-title-block">
      <h2 class="game-title">{{ game.name }}</h2>
      <p class="game-desc" *ngIf="game.description">{{ game.description }}</p>
    </div>

    <div class="game-actions">
      <button mat-flat-button color="primary" class="invite-btn" (click)="openQrShare()">
        <mat-icon>person_add</mat-icon> Invite
      </button>
      <!-- Always visible; on narrow screens only the icons show (the names stay as aria-labels). -->
      <button mat-stroked-button class="room-action" (click)="copyToClipboard()" aria-label="Copy game link" matTooltip="Copy game link">
        <mat-icon>link</mat-icon><span class="room-action-label">Copy link</span>
      </button>
      <button mat-stroked-button class="room-action" (click)="onGameReportClick.emit()" aria-label="Export results as PDF" matTooltip="Export results (PDF)">
        <mat-icon>download</mat-icon><span class="room-action-label">Export PDF</span>
      </button>
      <button mat-stroked-button class="room-action room-action--leave" (click)="onLeaveGameClick.emit()" aria-label="Leave game" matTooltip="Leave game">
        <mat-icon>logout</mat-icon><span class="room-action-label">Leave</span>
      </button>
    </div>
  </div>
</section>
