<section class="game-details-wrapper" *ngIf="game" aria-label="Game details">
  <div class="game-details">
    <div class="game-title-block">
      <h2 class="game-title">{{ game.name }}</h2>
      <p class="game-desc" *ngIf="game.description">{{ game.description }}</p>
    </div>

    <div class="game-actions">
      <button mat-flat-button color="primary" class="invite-btn" (click)="openQrShare()">
        <mat-icon>person_add</mat-icon> Invite
      </button>
      <button mat-icon-button [matMenuTriggerFor]="moreMenu" aria-label="More game actions" matTooltip="More">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #moreMenu="matMenu" xPosition="before">
        <button mat-menu-item (click)="copyToClipboard()">
          <mat-icon>link</mat-icon><span>Copy game link</span>
        </button>
        <button mat-menu-item (click)="onGameReportClick.emit()">
          <mat-icon>download</mat-icon><span>Export results (PDF)</span>
        </button>
        <button mat-menu-item (click)="onLeaveGameClick.emit()">
          <mat-icon>logout</mat-icon><span>Leave game</span>
        </button>
      </mat-menu>
    </div>
  </div>
</section>
