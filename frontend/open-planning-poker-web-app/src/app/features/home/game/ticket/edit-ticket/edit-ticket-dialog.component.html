<h2 mat-dialog-title>Edit ticket</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="edit-ticket">
    <mat-form-field appearance="outline">
      <mat-label>Ticket</mat-label>
      <input matInput formControlName="name" maxlength="255" cdkFocusInitial>
      <mat-error *ngIf="form.controls.name.invalid">Give the ticket a title (3 to 255 characters).</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="6" maxlength="4080"></textarea>
      <mat-hint>**bold**, *italic*, `code`, lists ("- ") and links work.</mat-hint>
    </mat-form-field>
    <div class="edit-preview" *ngIf="form.value.description">
      <span class="edit-preview-label">Preview</span>
      <div class="opp-markdown" [innerHTML]="form.value.description | oppMarkdown"></div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
  </mat-dialog-actions>
</form>
