<div
  class="card"
  [ngClass]="'card--' + size"
  [class.is-face-down]="faceDown"
  [class.is-selected]="selected"
  [class.is-empty]="empty"
  [class.is-dropping]="dropping"
  [class.is-outlier]="outlier"
  [style.--flip-delay]="flipDelay + 'ms'"
  role="img"
  [attr.aria-label]="ariaLabel">
  @if (!empty) {
    <div class="card-inner">
      <div class="card-face card-front">
        @if (size === 'lg') {
          <span class="card-pip card-pip--top" aria-hidden="true">{{ value }}</span>
        }
        <span class="card-value">{{ value }}</span>
        @if (size === 'lg') {
          <span class="card-pip card-pip--bottom" aria-hidden="true">{{ value }}</span>
        }
      </div>
      <div class="card-face card-back" aria-hidden="true"></div>
    </div>
  }
</div>
